name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example, v0.35.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Pin OSXCross so the toolchain cache key is stable and builds are reproducible.
  OSXCROSS_REF: e6ab3fa7423f9235ce9ed6381d6d3af191b46b59

jobs:
  validate-credentials:
    name: Validate Release Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v0.35.0."
            exit 1
          fi

      - name: Verify Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. Aborting release before any channel is published."
            exit 1
          fi
          # homebrew-tap is a public repo, so `git ls-remote` with bad creds still
          # succeeds via anonymous read fallback — it can't detect an expired token.
          # The REST API enforces whatever Authorization header is sent, even for
          # public resources, so it correctly 401s on invalid/expired credentials.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${HOMEBREW_TAP_TOKEN}" \
            https://api.github.com/repos/LegacyCodeHQ/homebrew-tap)
          if [ "$status" != "200" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN failed to authenticate against homebrew-tap (HTTP $status — it may be expired). Aborting release before any channel is published."
            exit 1
          fi

  goreleaser:
    needs: validate-credentials
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cmd/watch/web/package-lock.json

      - name: Install and build frontend
        run: |
          cd cmd/watch/web
          npm ci
          npm run build

      # Stream package-manager output so slow downloads are visible. Bound both
      # individual network requests and the whole step instead of silently waiting
      # inside the apt cache action. Keep caching the expensive built OSXCross below.
      - name: Install cross-compilation toolchains and OSXCross dependencies
        timeout-minutes: 15
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            clang llvm-dev libxml2-dev uuid-dev libssl-dev bash patch make tar \
            xz-utils bzip2 gzip sed cpio libbz2-dev

      # The built toolchain (clang wrappers + cctools/ld64 + the extracted SDK)
      # is identical run-to-run, so cache it on the pinned OSXCross ref + SDK.
      - name: Cache OSXCross toolchain
        id: osxcross
        uses: actions/cache@v6
        with:
          path: /tmp/osxcross/target
          key: osxcross-${{ env.OSXCROSS_REF }}-sdk12.3-${{ runner.os }}

      # Only the slow part (building OSXCross from source) is skipped on a hit.
      - name: Build OSXCross
        if: steps.osxcross.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
          cd /tmp/osxcross
          git checkout "${OSXCROSS_REF}"
          wget -nc https://github.com/joseluisq/macosx-sdks/releases/download/12.3/MacOSX12.3.sdk.tar.xz -O tarballs/MacOSX12.3.sdk.tar.xz
          UNATTENDED=yes OSX_VERSION_MIN=10.13 ./build.sh

      - name: Add OSXCross to PATH
        run: echo "/tmp/osxcross/target/bin" >> $GITHUB_PATH

      - name: Verify target C headers and linkers
        run: |
          for compiler in gcc aarch64-linux-gnu-gcc x86_64-w64-mingw32-gcc o64-clang oa64-clang; do
            echo "Checking $compiler"
            printf '%s\n' '#include <stdlib.h>' '#include <stdint.h>' '#include <stdio.h>' '#include <errno.h>' \
              'int main(void) { return 0; }' | \
              "$compiler" -x c - -o "$RUNNER_TEMP/clarity-${compiler}-check"
          done

      - name: Select curated release notes when available
        id: release-notes
        run: |
          notes="docs/release-notes-${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            echo "flags=--release-notes=$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ steps.release-notes.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm Package
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Node and npm versions
        run: |
          node --version
          npm --version

      - name: Set package version from tag
        run: |
          VERSION=${RELEASE_TAG#v}
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --access public --provenance

  update-homebrew:
    name: Update Homebrew Tap
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Extract version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          VERSION=${{ steps.version.outputs.version }}
          curl -sL "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_checksums.txt" -o checksums.txt

      - name: Parse checksums
        id: checksums
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "darwin_amd64=$(grep "clarity_${VERSION}_darwin_amd64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(grep "clarity_${VERSION}_darwin_arm64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(grep "clarity_${VERSION}_linux_amd64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(grep "clarity_${VERSION}_linux_arm64.tar.gz" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Clone homebrew tap
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/LegacyCodeHQ/homebrew-tap.git
          cd homebrew-tap

          # Create Formula directory if it doesn't exist
          mkdir -p Formula

          # Generate formula
          cat > Formula/clarity.rb <<EOF
          class Clarity < Formula
            desc "CLI tool for analyzing and visualizing dependency graphs"
            homepage "https://github.com/LegacyCodeHQ/clarity-cli"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${{ steps.checksums.outputs.darwin_arm64 }}"
              else
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${{ steps.checksums.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_linux_arm64.tar.gz"
                sha256 "${{ steps.checksums.outputs.linux_arm64 }}"
              else
                url "https://github.com/LegacyCodeHQ/clarity-cli/releases/download/v${VERSION}/clarity_${VERSION}_linux_amd64.tar.gz"
                sha256 "${{ steps.checksums.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "clarity"
            end

            test do
              system "#{bin}/clarity", "--version"
            end
          end
          EOF

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/clarity.rb
          git commit -m "Update clarity to v${VERSION}"
          git push origin trunk
